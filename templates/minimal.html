<!--
  ====================================================================
  菜單網站版型「極簡白 Minimal」(theme: minimal)
  - 網站內容（店名、菜單、顏色、背景）全部在 <script id="site-config"> 的 JSON 裡，
    用 builder.html 產生，不要把內容直接寫在 HTML。
  - 改設計：修改 <style id="theme"> 和下方 HTML 結構即可。
  - 必須保留的 id：brandName brandSub brandBadge cartBtn cartText cats search menu
    heroTagline heroTitle heroText1 heroText2 tableNote footerName footerText1 footerText2 copyright
  - 品項卡片由 engine 產生，class：.sec .sec-title .items .item .item-img .item-body
    .item-title .item-price .item-sub .item-desc .tags .tag .item-add
  - 顏色請用 CSS 變數：var(--bg) var(--card) var(--primary) var(--accent) var(--highlight)
    var(--line) var(--tag) var(--ink) var(--ink-bg) var(--muted-card) var(--on-accent)…
  - 最後一段 <script id="engine"> 是點餐程式，請不要修改。
  ====================================================================
-->

<style id="theme">
:root{--font-head:'Inter','Noto Sans TC',sans-serif;--font-body:'Inter','Noto Sans TC',sans-serif;--radius:14px;--radius-sm:10px;--max:880px;--bg:#FFFFFF;--card:#FFFFFF;--primary:#111111;--muted:#6B6B6B;--accent:#111111;--highlight:#FFD84D;--ok:#2F8F5B;--line:#E6E6E6;--tag:#FF6B3D}
.top{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.cart-btn{border-radius:99px}
.hero{padding:44px 0 22px;text-align:left}
#heroTagline{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-bg)}
#heroTitle{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;letter-spacing:-.02em;line-height:1.05}
#heroText1{font-size:1.05rem;margin-top:10px}
#heroText2{color:var(--muted-bg);font-size:.9rem}
#cats{position:sticky;top:var(--top-h);z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);padding:10px max(16px,calc((100% - 848px)/2));border-bottom:1px solid var(--line)}
.cat{padding:7px 14px;border-radius:99px;border:1px solid var(--line);font-size:.88rem;font-weight:600}
.cat.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.cat-ico{display:none}
.searchrow{padding-top:14px}
.sec{padding-top:30px}
.sec-title{font-size:1.35rem;font-weight:800;padding-bottom:6px}
.sec-ico{display:none}
.items{display:flex;flex-direction:column}
.item{display:flex;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.item-img{order:2;width:84px;height:84px;border-radius:12px;overflow:hidden;flex-shrink:0;background:#f3f3f3}
.item-img img{width:100%;height:100%;object-fit:cover}
.item-body{flex:1;min-width:0}
.item-head{flex-wrap:wrap}
.item-title{font-weight:600}
.item-price{order:5;width:100%;color:var(--ink);font-weight:600;margin-top:2px}
.item-dots{display:none}
.item-add{order:3;background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.item.in-cart .item-add{background:var(--ink);color:#fff;border-color:var(--ink)}
.foot{border-top:1px solid var(--line);margin-top:40px;color:var(--muted-bg)}
.btn.primary,.opt input:checked+span{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
</style>
