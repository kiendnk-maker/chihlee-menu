if(button.dataset.move){const [id,delta]=button.dataset.move.split(',');const n=db.categories.findIndex(c=>c.id===id);const j=n+Number(delta);if(n<0||j<0||j>=db.categories.length)return;[db.categories[n],db.categories[j]]=[db.categories[j],db.categories[n]];setDirty();rerender();return}
if(button.dataset.export){if(button.dataset.export==='json')download('macu-menu.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');if(button.dataset.export==='csv')exportCSV();if(button.dataset.export==='html')exportHTML();return}if(button.id==='importJSON'){$('importFile').click();return}if(button.id==='resetMenu'){if(!confirm('要將所有分類、品項與價格還原為圖片中的原始菜單嗎？'))return;db=clone(defaults);cart=[];editDirty=true;editCatId=db.categories[0].id;editorPage='list';setDirty();rerender()}}
function handleManagerSubmit(e){if(e.target.id==='editItemForm'){e.preventDefault();const f=e.target,fd=new FormData(f);const name=String(fd.get('name')||'').trim(),cat=getCat(String(fd.get('category'))),price=Number(fd.get('price'));if(!name||!cat||!Number.isFinite(price)||price<0){toast('請填入有效名稱、分類與價格');return}let img=String(fd.get('image')||'').trim();if(img&&!/^(https?:\/\/|data:image\/)/i.test(img)){toast('圖片網址僅支援 http(s) 或 data:image');return}const tags=String(fd.get('tags')||'').split(/[,，]/).map(x=>x.trim()).filter(Boolean);let item=editItemId?getItem(editItemId):null;if(!item){item={id:uid()};cat.items.push(item)}else{for(const c of db.categories){const idx=c.items.findIndex(x=>x.id===item.id);if(idx>=0&&c.id!==cat.id){c.items.splice(idx,1);cat.items.push(item);break}}}Object.assign(item,{name,price,desc:String(fd.get('desc')||'').trim(),tags,image:img,fixed:fd.has('fixed')});editCatId=cat.id;editorPage='list';setDirty();rerender();toast('品項已更新，記得儲存');return}
if(e.target.id==='editCatForm'){e.preventDefault();const fd=new FormData(e.target),name=String(fd.get('name')||'').trim();if(!name){toast('分類名稱不可空白');return}let cat=editCatId?getCat(editCatId):null;if(!cat){cat={id:uid(),items:[]};db.categories.push(cat)}Object.assign(cat,{name,en:String(fd.get('en')||'').trim(),icon:String(fd.get('icon')||'🧋').trim()});editCatId=cat.id;editorPage='list';setDirty();rerender();toast('分類已更新，記得儲存')}}
function exportCSV(){const rows=[['分類','英文副標','品名','價格','說明','標籤','固定冰糖','圖片']];db.categories.forEach(c=>c.items.forEach(i=>rows.push([c.name,c.en,i.name,Number(i.price).toFixed(2),i.desc||'',(i.tags||[]).join('|'),i.fixed?'是':'否',i.image||''])));const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('macu-menu.csv',csv,'text/csv;charset=utf-8')}
function exportHTML(){const root=document.documentElement.cloneNode(true);root.dataset.exported='true';root.dataset.exportToken='export-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);root.querySelector('#seed-data').textContent=JSON.stringify(db).replace(/</g,'\\u003c');root.querySelector('#managerRoot').innerHTML='';root.querySelector('#modalRoot').innerHTML='';root.querySelector('#toasts').innerHTML='';root.querySelector('body').classList.remove('lock');const search=root.querySelector('#search');search.setAttribute('value','');root.querySelector('#menu').innerHTML='';root.querySelector('#cats').innerHTML='';const s='<!doctype html>\n'+root.outerHTML;download('macu-ocean-menu.html',s,'text/html;charset=utf-8');toast('已匯出完整單檔 HTML')}
$('search').addEventListener('input',renderMenu);
$('cats').addEventListener('click',e=>{let a=e.target.closest('a[data-cat]');if(!a)return;activeId=a.dataset.cat;renderNav();if(activeId==='all')window.scrollTo({top:0,behavior:'smooth'})});
$('menu').addEventListener('click',e=>{let x=e.target.closest('[data-item]');if(x)openItem(x.dataset.item)});
$('menu').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('[data-item]')){e.preventDefault();openItem(e.target.closest('[data-item]').dataset.item)}});
$('cartBtn').addEventListener('click',showCart);$('cartBar').addEventListener('click',showCart);$('manageBtn').addEventListener('click',openManager);
$('modalRoot').addEventListener('click',e=>{const t=e.target;if(t.id==='activeOverlay'||t.closest('[data-close]')){closeModal();return}const q=t.closest('[data-qty]');if(q){choice.qty=Math.max(1,Math.min(99,choice.qty+Number(q.dataset.qty)));updateItemTotal();return}const cq=t.closest('[data-cart-qty]');if(cq){let[n,d]=cq.dataset.cartQty.split(',').map(Number);if(cart[n]){cart[n].qty+=d;if(cart[n].qty<=0)cart.splice(n,1)}renderCartBar();renderMenu();showCart();return}const del=t.closest('[data-remove]');if(del){cart.splice(Number(del.dataset.remove),1);renderCartBar();renderMenu();showCart();return}if(t.closest('#addToCart')){addCart();return}if(t.closest('#exportOrder')){orderExport();return}});
$('modalRoot').addEventListener('change',e=>{if(e.target.name==='冰量 Ice')choice.ice=e.target.value;if(e.target.name==='甜度 Sugar')choice.sugar=e.target.value;if(e.target.name==='topping'){const n=Number(e.target.dataset.idx);if(e.target.checked&&!choice.toppings.includes(n))choice.toppings.push(n);if(!e.target.checked)choice.toppings=choice.toppings.filter(x=>x!==n);updateItemTotal()}});
$('managerRoot').addEventListener('click',handleManager);$('managerRoot').addEventListener('submit',handleManagerSubmit);$('managerRoot').addEventListener('change',e=>{if(e.target.id==='adminCatSelect'){editCatId=e.target.value;renderAdminContent()}});
$('importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{const val=JSON.parse(await file.text());if(!valid(val))throw Error('格式不符');if(!confirm('匯入將覆蓋目前尚未儲存的菜單內容，確定嗎？'))return;db=clone(val);cart=[];editCatId=db.categories[0]?.id||'';editorPage='list';setDirty();rerender();toast('匯入成功，請按儲存')}catch(_){toast('無法匯入：請確認 JSON 格式')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('activeOverlay'))closeModal();else if($('managerOverlay'))closeManager()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='e'){e.preventDefault();if(!$('managerOverlay'))openManager()}});
window.addEventListener('beforeunload',e=>{if(editDirty){e.preventDefault();e.returnValue=''}});
renderMenu();renderCartBar();
})();
</script>
</body>
</html>
